<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>

<meta name="mobile-web-app-capable" content="yes">

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
/>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
/>

<title>Galaxia de Milagros Lopez</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

    touch-action: none;

    overscroll-behavior: none;
}

body {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;
}

canvas {
    display: block;

    width: 100vw !important;
    height: 100vh !important;

    position: fixed;

    top: 0;
    left: 0;
}


/* =====================================================
   BOTÓN DE MÚSICA
===================================================== */

#play-btn {

    position: fixed;

    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0, 0, 0, 0.65);

    border: 2px solid #FF69B4;

    color: #FFD4E8;

    padding: 12px 24px;

    font-size: 18px;

    border-radius: 25px;

    cursor: pointer;

    z-index: 100;

    text-shadow:
        0 0 5px #FF69B4;

    box-shadow:
        0 0 15px rgba(255, 105, 180, 0.7);

    transition: 0.3s;
}

#play-btn:hover {

    background:
        rgba(255, 105, 180, 0.2);

}

</style>

</head>

<body>


<button id="play-btn">
    🎵 Reproducir Música
</button>


<canvas id="c"></canvas>


<!-- ===================================================
     REPRODUCTOR DE AUDIO
==================================================== -->

<audio
    id="audio"
    preload="auto"
></audio>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script>


// =====================================================
// AUDIO
// =====================================================

const audio =
    document.getElementById("audio");


const playBtn =
    document.getElementById("play-btn");


// =====================================================
// PLAYLIST
// =====================================================

const playlist = [

    "La_Mujer_Perfecta.mp3",

    "No_Me_Doy_Por_Vencido.mp3"

];


// Canción actual
let currentSong =
    0;


// Cargar la primera canción
audio.src =
    playlist[currentSong];


// =====================================================
// CUANDO TERMINA UNA CANCIÓN
// =====================================================

audio.addEventListener(
    "ended",
    () => {

        // Pasar a la siguiente canción
        currentSong++;


        // Si ya terminó la última,
        // volver nuevamente a la primera
        if (
            currentSong >=
            playlist.length
        ) {

            currentSong =
                0;

        }


        // Cargar siguiente canción
        audio.src =
            playlist[currentSong];


        // Reproducir automáticamente
        audio.play().catch(

            error => {

                console.log(
                    "No se pudo reproducir la siguiente canción:",
                    error
                );

            }

        );

    }
);


// =====================================================
// MANTENER BOTÓN OCULTO DURANTE LA SESIÓN
// =====================================================

if (
    sessionStorage.getItem(
        "musicStarted"
    ) === "true"
) {

    playBtn.style.display =
        "none";

}


// =====================================================
// ESCENA
// =====================================================

const scene =
    new THREE.Scene();


scene.fog =
    new THREE.FogExp2(

        0x000000,

        0.001

    );


// =====================================================
// CÁMARA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(

        60,

        window.innerWidth /
        window.innerHeight,

        1,

        5000

    );


camera.position.set(

    0,

    300,

    700

);


// =====================================================
// RENDER
// =====================================================

const canvas =
    document.getElementById("c");


const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        2

    )

);


// =====================================================
// CONTROLES
// =====================================================

const controls =
    new THREE.OrbitControls(

        camera,

        renderer.domElement

    );


controls.enableDamping =
    true;


controls.dampingFactor =
    0.05;


controls.enablePan =
    false;


controls.minDistance =
    200;


controls.maxDistance =
    2000;


controls.maxPolarAngle =
    Math.PI / 2 + 0.1;


// =====================================================
// GRUPO PRINCIPAL DE LA GALAXIA
// =====================================================

const galaxyGroup =
    new THREE.Group();


scene.add(
    galaxyGroup
);


// =====================================================
// ESTRELLAS DEL UNIVERSO
// =====================================================

const starsGeo =
    new THREE.BufferGeometry();


const starsCount =
    20000;


const pos =
    new Float32Array(
        starsCount * 3
    );


const cols =
    new Float32Array(
        starsCount * 3
    );


for (
    let i = 0;
    i < starsCount;
    i++
) {

    pos[i * 3] =

        (Math.random() - 0.5)

        * 5000;


    pos[i * 3 + 1] =

        (Math.random() - 0.5)

        * 4000;


    pos[i * 3 + 2] =

        (Math.random() - 0.5)

        * 5000;


    const mix =
        Math.random();


    cols[i * 3] =
        1;


    cols[i * 3 + 1] =

        0.65

        +

        mix * 0.35;


    cols[i * 3 + 2] =

        0.8

        +

        mix * 0.2;

}


starsGeo.setAttribute(

    "position",

    new THREE.BufferAttribute(

        pos,

        3

    )

);


starsGeo.setAttribute(

    "color",

    new THREE.BufferAttribute(

        cols,

        3

    )

);


const starsMat =
    new THREE.PointsMaterial({

        size: 1.5,

        vertexColors: true,

        transparent: true,

        opacity: 0.8

    });


scene.add(

    new THREE.Points(

        starsGeo,

        starsMat

    )

);


// =====================================================
// POLVO GALÁCTICO
// =====================================================

const dustGeo =
    new THREE.BufferGeometry();


const dustCount =
    40000;


const dustPos =
    new Float32Array(
        dustCount * 3
    );


const dustCols =
    new Float32Array(
        dustCount * 3
    );


for (
    let i = 0;
    i < dustCount;
    i++
) {

    const radius =

        100

        +

        Math.random() * 900;


    const theta =

        Math.random()

        *

        Math.PI

        *

        2;


    const y =

        (Math.random() - 0.5)

        *

        (Math.random() * 100);


    dustPos[i * 3] =

        Math.cos(theta)

        *

        radius;


    dustPos[i * 3 + 1] =
        y;


    dustPos[i * 3 + 2] =

        Math.sin(theta)

        *

        radius;


    const mix =
        Math.random();


    dustCols[i * 3] =
        1;


    dustCols[i * 3 + 1] =

        0.55

        +

        mix * 0.4;


    dustCols[i * 3 + 2] =

        0.75

        +

        mix * 0.25;

}


dustGeo.setAttribute(

    "position",

    new THREE.BufferAttribute(

        dustPos,

        3

    )

);


dustGeo.setAttribute(

    "color",

    new THREE.BufferAttribute(

        dustCols,

        3

    )

);


const dustMat =
    new THREE.PointsMaterial({

        size: 2,

        vertexColors: true,

        transparent: true,

        opacity: 1,

        blending:
            THREE.AdditiveBlending

    });


galaxyGroup.add(

    new THREE.Points(

        dustGeo,

        dustMat

    )

);


// =====================================================
// NÚCLEO CENTRAL
// =====================================================

const sunCoreRadius =
    70;


const sunCore =
    new THREE.Mesh(

        new THREE.SphereGeometry(

            sunCoreRadius,

            32,

            32

        ),

        new THREE.MeshBasicMaterial({

            color:
                0x050505

        })

    );


galaxyGroup.add(
    sunCore
);


// =====================================================
// RESPLANDOR ROSADO
// =====================================================

function createGlowingRing() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        1024;


    canvas.height =
        1024;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const grad =
        ctx.createRadialGradient(

            512,
            512,
            100,

            512,
            512,
            512

        );


    grad.addColorStop(

        0,

        "rgba(255,255,255,1)"

    );


    grad.addColorStop(

        0.15,

        "rgba(255,182,217,1)"

    );


    grad.addColorStop(

        0.35,

        "rgba(255,105,180,0.8)"

    );


    grad.addColorStop(

        0.65,

        "rgba(255,20,147,0.25)"

    );


    grad.addColorStop(

        1,

        "rgba(0,0,0,0)"

    );


    ctx.fillStyle =
        grad;


    ctx.fillRect(

        0,

        0,

        1024,

        1024

    );


    return new THREE.CanvasTexture(
        canvas
    );

}


// =====================================================
// ANILLO CENTRAL
// =====================================================

const ring =
    new THREE.Mesh(

        new THREE.PlaneGeometry(

            450,

            450

        ),

        new THREE.MeshBasicMaterial({

            map:
                createGlowingRing(),

            transparent:
                true,

            blending:
                THREE.AdditiveBlending,

            side:
                THREE.DoubleSide,

            depthWrite:
                false

        })

    );


ring.rotation.x =
    -Math.PI / 2;


galaxyGroup.add(
    ring
);


// =====================================================
// TEXTO CENTRAL
// =====================================================

function createSunText() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        1024;


    canvas.height =
        256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.font =
        "bold 80px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "white";


    ctx.shadowColor =
        "rgba(255,105,180,1)";


    ctx.shadowBlur =
        25;


    ctx.fillText(

        "Feliz Cumpleaños Lupeeeee",

        512,

        100

    );


    return new THREE.CanvasTexture(
        canvas
    );

}


const sunTextMaterial =
    new THREE.SpriteMaterial({

        map:
            createSunText(),

        transparent:
            true,

        blending:
            THREE.AdditiveBlending,

        depthTest:
            false

    });


const sunTextSprite =
    new THREE.Sprite(
        sunTextMaterial
    );


sunTextSprite.scale.set(

    100,

    25,

    1

);


sunTextSprite.position.set(

    0,

    sunCoreRadius - 50,

    0

);


scene.add(
    sunTextSprite
);


// =====================================================
// FLOR ROSADA
// =====================================================

function createPinkFlowerTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;


    canvas.height =
        256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const center =
        128;


    ctx.clearRect(

        0,

        0,

        256,

        256

    );


    // =================================================
    // PÉTALOS EXTERIORES
    // =================================================

    const outerPetals =
        12;


    for (
        let i = 0;
        i < outerPetals;
        i++
    ) {

        ctx.save();


        ctx.translate(

            center,

            center

        );


        ctx.rotate(

            i

            *

            Math.PI

            *

            2

            /

            outerPetals

        );


        const gradient =
            ctx.createLinearGradient(

                0,

                -100,

                0,

                -20

            );


        gradient.addColorStop(

            0,

            "#FFD4E8"

        );


        gradient.addColorStop(

            0.45,

            "#FF8FC7"

        );


        gradient.addColorStop(

            1,

            "#FF3D9A"

        );


        ctx.fillStyle =
            gradient;


        ctx.shadowColor =
            "rgba(255,105,180,0.6)";


        ctx.shadowBlur =
            8;


        ctx.beginPath();


        ctx.ellipse(

            0,

            -63,

            20,

            52,

            0,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.restore();

    }


    // =================================================
    // PÉTALOS INTERIORES
    // =================================================

    const innerPetals =
        10;


    for (
        let i = 0;
        i < innerPetals;
        i++
    ) {

        ctx.save();


        ctx.translate(

            center,

            center

        );


        ctx.rotate(

            i

            *

            Math.PI

            *

            2

            /

            innerPetals

            +

            0.25

        );


        const gradient =
            ctx.createLinearGradient(

                0,

                -70,

                0,

                -10

            );


        gradient.addColorStop(

            0,

            "#FFC1DC"

        );


        gradient.addColorStop(

            1,

            "#FF4FA3"

        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.ellipse(

            0,

            -42,

            15,

            36,

            0,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.restore();

    }


    // =================================================
    // CENTRO DE LA FLOR
    // =================================================

    const centerGradient =
        ctx.createRadialGradient(

            center,

            center,

            2,

            center,

            center,

            30

        );


    centerGradient.addColorStop(

        0,

        "#FFF8FC"

    );


    centerGradient.addColorStop(

        0.35,

        "#FFB6D9"

    );


    centerGradient.addColorStop(

        1,

        "#FF4F9E"

    );


    ctx.fillStyle =
        centerGradient;


    ctx.beginPath();


    ctx.arc(

        center,

        center,

        27,

        0,

        Math.PI * 2

    );


    ctx.fill();


    // =================================================
    // DETALLES BLANCOS
    // =================================================

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const angle =

            Math.random()

            *

            Math.PI

            *

            2;


        const radius =

            Math.random()

            *

            18;


        ctx.beginPath();


        ctx.arc(

            center

            +

            Math.cos(angle)
            * radius,

            center

            +

            Math.sin(angle)
            * radius,

            1.5

            +

            Math.random()
            * 1.5,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            "rgba(255,255,255,0.8)";


        ctx.fill();

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.needsUpdate =
        true;


    return texture;

}


// =====================================================
// TEXTURAS DE FLORES
// =====================================================

const flowerTextures = [

    createPinkFlowerTexture(),

    createPinkFlowerTexture(),

    createPinkFlowerTexture(),

    createPinkFlowerTexture()

];


// =====================================================
// ELEMENTOS QUE ORBITAN
// =====================================================

const elementsToOrbit =
    [];


// =====================================================
// FLORES ORBITANDO
// =====================================================

for (
    let i = 0;
    i < 160;
    i++
) {

    const tex =
        flowerTextures[

            Math.floor(

                Math.random()

                *

                flowerTextures.length

            )

        ];


    const material =
        new THREE.SpriteMaterial({

            map:
                tex,

            transparent:
                true,

            depthWrite:
                false,

            alphaTest:
                0.01

        });


    const sprite =
        new THREE.Sprite(
            material
        );


    const radius =

        150

        +

        Math.random()
        * 750;


    const angle =

        Math.random()

        *

        Math.PI

        *

        2;


    const size =

        25

        +

        Math.random()
        * 45;


    sprite.scale.set(

        size,

        size,

        1

    );


    sprite.userData = {

        r:
            radius,

        angle:
            angle,

        speed:

            0.0005

            +

            Math.random()
            * 0.0015,

        yOffset:

            (Math.random() - 0.5)

            *

            80

    };


    galaxyGroup.add(
        sprite
    );


    elementsToOrbit.push(
        sprite
    );

}


// =====================================================
// FRASES
// =====================================================

const frases = [

    "Eres muy especial ✨",

    "Siempre brillas 💖",

    "Sonríe siempre 🌸",

    "Mi flor favorita 🌸",

    "Eres bella 🥰",

    "Eres Hermosa 🥰",

    "Eres Preciosa 🥰",

    "Te adoro ♥️",

    "Te quiero ♥️",

    "Eres Un Sol ☀️",

    "La Mujer Perfecta 💯",

    "Eres Un Milagro 🕊️",

    "Eres Luz ✨",

    "Eres un sueño 💗",

    "Luz en mi vida 💫",

    "Mi universo 🌌",

    "Eres pura magia ✨",

    "Pintas mi mundo 🌷",

    "Mi pedacito de cielo 🌸",

    "Contigo todo es mejor ❤️‍🩹",

    "Feliz Cumpleañoos 🎉"

];


// =====================================================
// CREAR TEXTO DE FRASES
// =====================================================

function createFraseText(
    text
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        1024;


    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.font =
        "bold 60px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "#FFF5FA";


    ctx.shadowColor =
        "#FF69B4";


    ctx.shadowBlur =
        15;


    ctx.fillText(

        text,

        512,

        64

    );


    ctx.shadowBlur =
        30;


    ctx.shadowColor =
        "#FF1493";


    ctx.fillText(

        text,

        512,

        64

    );


    return new THREE.CanvasTexture(
        canvas
    );

}


// =====================================================
// FRASES ORBITANDO
// =====================================================

for (
    let i = 0;
    i < 60;
    i++
) {

    const tex =
        createFraseText(

            frases[
                i % frases.length
            ]

        );


    const sprite =
        new THREE.Sprite(

            new THREE.SpriteMaterial({

                map:
                    tex,

                transparent:
                    true,

                blending:
                    THREE.AdditiveBlending

            })

        );


    const radius =

        200

        +

        Math.random()
        * 650;


    const angle =

        Math.random()

        *

        Math.PI

        *

        2;


    sprite.scale.set(

        160,

        20,

        1

    );


    sprite.userData = {

        r:
            radius,

        angle:
            angle,

        speed:

            0.0007

            +

            Math.random()
            * 0.0012,

        yOffset:

            (Math.random() - 0.5)

            *

            100

    };


    galaxyGroup.add(
        sprite
    );


    elementsToOrbit.push(
        sprite
    );

}


// =====================================================
// AJUSTAR ESCENA
// =====================================================

function resizeScene() {

    const width =
        window.innerWidth;


    const height =
        window.innerHeight;


    camera.aspect =
        width / height;


    camera.updateProjectionMatrix();


    renderer.setSize(

        width,

        height,

        false

    );


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    // Mantener el botón oculto
    if (
        sessionStorage.getItem(
            "musicStarted"
        ) === "true"
    ) {

        playBtn.style.display =
            "none";

    }

}


// =====================================================
// BOTÓN
// MÚSICA + FULLSCREEN + HORIZONTAL
// =====================================================

playBtn.addEventListener(
    "click",
    async () => {


        // Guardar que ya se presionó
        sessionStorage.setItem(

            "musicStarted",

            "true"

        );


        // Ocultar botón
        playBtn.style.display =
            "none";


        // =============================================
        // COMENZAR DESDE LA PRIMERA CANCIÓN
        // =============================================

        currentSong =
            0;


        audio.src =
            playlist[currentSong];


        // =============================================
        // REPRODUCIR
        // =============================================

        try {

            await audio.play();

        }

        catch (
            error
        ) {

            console.log(

                "No se pudo reproducir el audio:",

                error

            );

        }


        // =============================================
        // DETECTAR MÓVIL
        // =============================================

        const isMobile =

            /Android|iPhone|iPad|iPod/i.test(

                navigator.userAgent

            );


        if (
            isMobile
        ) {

            // =========================================
            // PANTALLA COMPLETA
            // =========================================

            try {

                const element =
                    document.documentElement;


                if (
                    element.requestFullscreen
                ) {

                    await element.requestFullscreen();

                }

                else if (
                    element.webkitRequestFullscreen
                ) {

                    await element.webkitRequestFullscreen();

                }

                else if (
                    element.msRequestFullscreen
                ) {

                    await element.msRequestFullscreen();

                }

            }

            catch (
                error
            ) {

                console.log(

                    "No se pudo activar pantalla completa:",

                    error

                );

            }


            // =========================================
            // ORIENTACIÓN HORIZONTAL
            // =========================================

            try {

                if (

                    screen.orientation

                    &&

                    screen.orientation.lock

                ) {

                    await screen.orientation.lock(
                        "landscape"
                    );

                }

            }

            catch (
                error
            ) {

                console.log(

                    "No se pudo bloquear la orientación:",

                    error

                );

            }

        }


        setTimeout(

            resizeScene,

            300

        );

    }
);


// =====================================================
// ANIMACIÓN
// =====================================================

let time =
    0;


function animate() {

    requestAnimationFrame(
        animate
    );


    time +=
        0.01;


    controls.update();


    // =================================================
    // PULSO CENTRAL
    // =================================================

    const pulse =

        1

        +

        Math.sin(
            time * 2
        )

        *

        0.04;


    sunCore.scale.set(

        pulse,

        pulse,

        pulse

    );


    ring.scale.set(

        pulse,

        pulse,

        pulse

    );


    // =================================================
    // ROTACIÓN DE LA GALAXIA
    // =================================================

    galaxyGroup.rotation.y +=
        0.001;


    ring.rotation.z -=
        0.002;


    // =================================================
    // MOVIMIENTO DE FLORES Y FRASES
    // =================================================

    elementsToOrbit.forEach(

        el => {


            el.userData.angle -=
                el.userData.speed;


            el.position.x =

                Math.cos(
                    el.userData.angle
                )

                *

                el.userData.r;


            el.position.z =

                Math.sin(
                    el.userData.angle
                )

                *

                el.userData.r;


            el.position.y =

                el.userData.yOffset

                +

                Math.sin(

                    time

                    +

                    el.userData.angle * 5

                )

                *

                15;

        }

    );


    // Texto siempre mirando a cámara
    sunTextSprite.lookAt(
        camera.position
    );


    renderer.render(

        scene,

        camera

    );

}


animate();
